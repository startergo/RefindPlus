name: Build and Upload Artifacts for RefindPlus

on:
  workflow_dispatch:
  push:
    branches:
      - test-changes
  pull_request:
    branches:
      - test-changes

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 2.7
        run: |
          curl -O https://www.python.org/ftp/python/2.7.18/python-2.7.18-macosx10.9.pkg
          sudo installer -pkg python-2.7.18-macosx10.9.pkg -target /

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install || true

      - name: Set up build environment
        run: |
          if [[ "${PATH}" != *"/usr/local/bin"* ]] ; then export PATH="/usr/local/bin:${PATH}"; fi
          brew install nasm
          brew install acpica
          brew install ocmtoc
          brew install binutils

      - name: Clone RefindPlusUDK repository
        run: |
          mkdir -p edk2
          git clone https://github.com/${{ github.repository_owner }}/RefindPlusUDK.git edk2
          cd edk2
          git checkout rudk
          git remote add upstream https://github.com/dakanji/RefindPlusUDK.git

      - name: Run Build Script
        env:
          TERM: xterm
        run: |
          cd edk2/000-BuildScript
          chmod +x RefindPlusBuilder.sh
          sh RefindPlusBuilder.sh test-changes

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: refindplus-artifacts
          path: RefindPlusPkg/Build